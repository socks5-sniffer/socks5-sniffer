<svg xmlns="http://www.w3.org/2000/svg" width="900" height="332" viewBox="0 0 900 332" role="img" aria-label="socks5-sniffer terminal banner">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; fill: #1f2328; }
    .l { opacity: 0; animation: in .45s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    .cur { animation: blink 1.1s step-end infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  <rect x="1" y="1" width="898" height="330" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M1 13a12 12 0 0 1 12-12h874a12 12 0 0 1 12 12v31H1z" fill="#f6f8fa"/>
  <line x1="1" y1="44" x2="899" y2="44" stroke="#d0d7de"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57"/><circle cx="46" cy="23" r="6" fill="#febc2e"/><circle cx="66" cy="23" r="6" fill="#28c840"/>
  <text x="450" y="28" text-anchor="middle" style="font-size:13px;fill:#656d76">socks5-sniffer@lab: ~</text>
  <text class="l" style="animation-delay:0.3s" x="40" y="92"><tspan fill="#8250df">~$</tspan> whoami</text>
  <text class="l" style="animation-delay:0.9s" x="40" y="126"><tspan fill="#0969da" font-weight="700">socks5-sniffer</tspan> <tspan fill="#656d76">— builds AI systems that have to prove they work</tspan></text>
  <text class="l" style="animation-delay:1.7s" x="40" y="160"><tspan fill="#8250df">~$</tspan> cat focus.txt</text>
  <text class="l" style="animation-delay:2.3s" x="40" y="194">multi-agent evaluation <tspan fill="#656d76">·</tspan> DevSecOps <tspan fill="#656d76">·</tspan> cloud-native <tspan fill="#656d76">·</tspan> hardware on the bench</text>
  <text class="l" style="animation-delay:3.1s" x="40" y="228"><tspan fill="#8250df">~$</tspan> ./run-experiment --publish-results=always</text>
  <text class="l" style="animation-delay:3.8s" x="40" y="262"><tspan fill="#9a6700">✗ hypothesis falsified</tspan> <tspan fill="#656d76">(AUC ≈ 0.48)</tspan>  <tspan fill="#1a7f37">✓ result published anyway</tspan></text>
  <text class="cur" x="40" y="296"><tspan fill="#8250df">~$</tspan> <tspan fill="#0969da">▍</tspan></text>
</svg>
